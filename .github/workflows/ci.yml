# Platform CI — 2 tiers (M8 §3.8 / DoD-P0-04, NFR-SELFTEST-001).
#
#   1. `lint`     — `ubuntu-latest`, always: lint + format + import-lint boundary
#                   enforcement. No GPU, no consumer repo.
#   2. `selftest` — `[self-hosted, cv-infra-gpu]`, OPT-IN: `cv-infra selftest`
#                   round-trips the BUILT-IN stub through the deployed
#                   orchestrator. Zero consumer dependency by construction — the
#                   command takes no input at all (see the job comment for the
#                   preconditions and for why it is gated OFF today).
#
# Both tiers use only this repository: the platform CI never checks out, builds
# or reads a consumer repo (boundary rule ③ / NFR-SELFTEST-001).
#
# Reproducibility (decision 2026-06-24 env-reproducibility §5): every `uses:`
# action is version-pinned (no mutable / floating-major tags), the uv binary is
# pinned, and deps come from the committed `uv.lock` via `uv sync --frozen`.
# Every `uses:` below is pinned to the IMMUTABLE commit SHA of its release tag
# (FU-3 F1, resolved 2026-07-03 via `git ls-remote --tags`; the trailing comment
# names the tag). Do not re-float to tag refs — bump = new SHA + new tag comment.

name: ci

on:
  push:
  pull_request:
  # Manual trigger so tier 2 can have its FIRST run without waiting for an
  # unrelated code push (it is still gated by `vars.CV_SELFTEST_ENABLED` below).
  # GitHub only offers this button for the workflow file on the default branch.
  workflow_dispatch:

# Least privilege: the lint tier only reads the checked-out tree.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + import-boundary (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"

      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          version: "0.11.13"

      - name: Sync environment (frozen — honor committed uv.lock)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Import-boundary enforcement (import-linter)
        run: uv run lint-imports --config .importlinter

  # --------------------------------------------------------------------------
  # Tier 2 — platform self-test on the GPU workstation (REQ-SELFTEST-001..004,
  # NFR-SELFTEST-001). `cv-infra selftest` submits the platform's OWN built-in
  # stub through the ordinary UC-01 path and folds the terminal verdict into the
  # exit code (0 pass / 1 fail / 2 the stub envelope was rejected / 3 platform or
  # configuration problem) — the job status IS that exit code.
  #
  # ⚠ GATED OFF, AND IT HAS NEVER RUN — measured 2026-08-19: this job appears in
  # 3 of the 41 CI runs in this repository's history and is `skipped` in all 3
  # (`gh api repos/<owner>/<repo>/actions/runs/<id>/jobs`). So NFR-SELFTEST-001's
  # CI clause still has ZERO execution evidence, and what is missing is
  # CONFIGURATION, not code — the `if:` below is false until an operator sets the
  # repository variable. Preconditions, each with where it stood on 2026-08-19:
  #   (1) a self-hosted runner online with the `cv-infra-gpu` label, registered to
  #       THIS repo — MET: `cv-infra-gh-runner.service` (etri6000-cv-infra ->
  #       cv-infra-workspace) active/running on the deployment host, alongside the
  #       separate repo-level runner that serves the consumer repo.
  #   (2) a resident orchestrator reachable from that runner (`CV_INFRA_API` repo
  #       variable, or the CLI default 127.0.0.1:8000 on the same host) — MET:
  #       127.0.0.1:8000 listening, `GET /monitor.json` -> 200.
  #   (3) `CV_SELFTEST_SUT_IMAGE` = a PLATFORM-INTERNAL stub SUT image ref. The
  #       image EXISTS since p5c15 (`docker/selftest_stub/` -> build recipe in its
  #       README; the live self-test round-trips through it) — this comment used
  #       to say it did not, which went stale the day it was built. Unset/empty =>
  #       the CLI refuses with exit 3 and never falls back to a consumer image
  #       (NFR-SELFTEST-001) — a loud, honest failure, not a green run.
  # Remaining gap = the two repo VARIABLES (`CV_SELFTEST_ENABLED=true` and
  # `CV_SELFTEST_SUT_IMAGE=<stub ref>`), settable only by a repo admin. They are
  # VARIABLES (not secrets), and no value for either is baked here.
  selftest:
    name: platform self-test (self-hosted GPU)
    needs: lint
    if: ${{ vars.CV_SELFTEST_ENABLED == 'true' }}
    runs-on: [self-hosted, cv-infra-gpu]
    # Job cap sits ABOVE the CLI's own --timeout below, so a wedged round-trip is
    # ended by the CLI (honest exit 3 + message) rather than by a job cancellation.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          version: "0.11.13"

      # uv provisions the pinned interpreter itself (no setup-python on the
      # self-hosted box) and installs from the committed lock — same wheel the
      # deployment ships.
      - name: Sync environment (frozen — honor committed uv.lock)
        run: uv sync --frozen

      # No inputs, no consumer checkout, no scenario file: the request IS the
      # built-in stub. --trigger-source ci-cd records the provenance verbatim
      # (REQ-INTAKE-003); the exit code is the job's status (0/1/2/3).
      #
      # --timeout 1800 is a PROVISIONAL CI budget, not a measured NFR value
      # (CLAUDE §2-4): the stub's sim-time budget is 30 s, and the wall-clock cost
      # of the same round-trip has been measured OFF CI since p5c15 (live: ~28 s
      # warm on the deployment host, ~141 s cold on another) — never yet from a CI
      # job, and under non-exclusive conditions, so neither number is written into
      # an NFR or used to tighten this cap. Replace 1800 with a cost measured from
      # THIS tier, in the same commit that records the measurement.
      - name: cv-infra selftest (built-in stub round-trip)
        env:
          CV_SELFTEST_SUT_IMAGE: ${{ vars.CV_SELFTEST_SUT_IMAGE }}
          CV_INFRA_API: ${{ vars.CV_INFRA_API }}
        run: uv run cv-infra selftest --trigger-source ci-cd --timeout 1800
