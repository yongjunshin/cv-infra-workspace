# Platform CI — one job: lint, format, import boundary, and the suite under branch
# coverage. No GPU, no consumer repository, no docker daemon: everything the verify
# pipeline does with containers is exercised against a duck-typed fake client, so this
# tier is a complete signal for the code and says nothing about the GPU host.
#
# Reproducibility (decision 2026-06-24 env-reproducibility §5): every `uses:` is pinned
# to the IMMUTABLE commit SHA of its release tag (the trailing comment names the tag),
# the uv binary is pinned, deps come from the committed `uv.lock` via `uv sync --frozen`,
# and PICT is built from a pinned commit. Do not re-float to tag refs — a bump is a new
# SHA plus a new tag comment.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: this tier only reads the checked-out tree.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # The `name:` is the check name GitHub publishes and may be a REQUIRED status check
    # in branch protection, where a rename shows up as a check that is "expected" and
    # never arrives. Renaming it is a repo-admin change, not a CI-file edit.
    name: lint + import-boundary (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"

      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          version: "0.11.13"

      - name: Sync environment (frozen — honor committed uv.lock)
        run: uv sync --frozen

      # PICT is REUSED, not reimplemented (do-not-reinvent), and it ships no release
      # binary — so CI builds the pinned commit itself and caches the result. The cache
      # key is that commit: a different pin is a different key, never a stale hit.
      - name: Restore PICT (pinned commit build)
        id: pict-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        with:
          path: ~/.cache/cv-infra/pict
          key: pict-${{ runner.os }}-0c66a8e332655cd64802e18de962dacbbe3882bd

      - name: Build PICT (pinned commit)
        if: steps.pict-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/microsoft/pict "$RUNNER_TEMP/pict"
          git -C "$RUNNER_TEMP/pict" checkout 0c66a8e332655cd64802e18de962dacbbe3882bd
          make -C "$RUNNER_TEMP/pict"
          mkdir -p ~/.cache/cv-infra/pict
          cp "$RUNNER_TEMP/pict/pict" ~/.cache/cv-infra/pict/pict

      # The suite skips its PICT-backed tests when this is unset, so exporting it is
      # what makes the covering-array tests actually run here.
      - name: Export CV_PICT_BIN
        run: echo "CV_PICT_BIN=$HOME/.cache/cv-infra/pict/pict" >> "$GITHUB_ENV"

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Import-boundary enforcement (import-linter)
        run: uv run lint-imports --config .importlinter

      # Two steps, not one, so a TEST failure and the COVERAGE verdict stay
      # distinguishable in the run log: `coverage run` exits with pytest's own status,
      # and only the step after it is about the number.
      #
      # `env -u PYTHONPATH` is a no-op on `ubuntu-latest`; it is here so this line stays
      # BYTE-IDENTICAL to the command a developer runs locally, where a sourced ROS 2
      # environment leaks its PYTHONPATH into the shell and breaks pytest collection.
      # Every coverage flag comes from pyproject.toml `[tool.coverage.*]`; none is
      # passed here, so CI and local cannot drift apart in configuration.
      - name: Test suite under branch coverage
        run: env -u PYTHONPATH uv run coverage run -m pytest -q

      - name: Coverage report (fail_under lives in pyproject.toml)
        run: env -u PYTHONPATH uv run coverage report
