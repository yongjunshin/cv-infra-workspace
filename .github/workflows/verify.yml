# Reusable verification workflow — the ONE thing a consumer wires into their CI:
#
#   jobs:
#     verify:                              # job-level `uses:` — no runs-on/steps here
#       permissions: { checks: write, pull-requests: write, contents: read }
#       uses: yongjunshin/cv-infra-workspace/.github/workflows/verify.yml@minimal-verify
#       #     ^ branch ref until a v2 release tag exists; then pin to the tag (README §consumer)
#       with:
#         sim_script: verify/sim.py
#         sim_input_space: verify/param_space.pict
#         sim_output_dir: verify/out
#         sim_image: nvcr.io/nvidia/isaac-sim:5.1.0@sha256:f3563cb…   # digest, never a tag
#         oracle_script: verify/oracle.py       # omit => sweep mode (does not gate)
#
# The inputs below are the CLI's flags, one for one (`cv-infra verify --help`), so the
# workflow adds no vocabulary of its own: what a developer runs on their workstation and
# what CI runs are the same command with the same words. `tests/test_gh_wiring_static.py`
# holds that 1:1 mechanically — an input added here without its flag fails the suite.
#
# WHAT RUNS WHERE. This file executes on the self-hosted GPU workstation (label =
# `runner_label`). It CHECKS OUT the caller's repository — the sim script, the PICT model
# and the oracle are the consumer's files, read from that checkout — and hands the rest to
# `cv-infra verify`, which is the only thing that talks to docker.
#
# TRUST BOUNDARY (read before enabling on a public repo): checking out a pull request
# means the head branch's code runs on this machine, inside a container with the GPU
# attached. For a repo that accepts fork PRs, turn ON "Require approval for all external
# contributors" (Settings → Actions → Fork pull request workflows) — that setting, not
# this file, is what keeps an untrusted PR from executing here. `persist-credentials:
# false` keeps the job's token out of the checked-out `.git/config` either way.
#
# RUNNER PROVISIONING (premise, not something this file can assert): the runner host has
# `cv-infra` on PATH and a `python` that can `import cv_infra` (one venv, both), a docker
# daemon with the NVIDIA container runtime, `CV_PICT_BIN` (see
# scripts/workstation_setup/install_pict.sh) and `ACCEPT_EULA` / `PRIVACY_CONSENT` in the
# runner service environment. Each missing piece is a named exit 3, never a silent pass.
#
# PINS (CLAUDE.md §2-7): every `uses:` is an immutable commit SHA (the trailing comment
# names the tag it belonged to). A bump is a new SHA plus a new comment — never a tag or
# branch ref, which can move under us.

name: cv-infra-verify

on:
  workflow_call:
    inputs:
      sim_script:
        description: >-
          Standalone Isaac Sim script, checkout-relative. Run once per case as
          `/isaac-sim/python.sh <sim_script> --<axis>=<value> ...` with `CV_SEED` in env;
          it boots and closes its own SimulationApp.
        required: true
        type: string
      sim_input_space:
        description: >-
          PICT model file, checkout-relative. Its parameters ARE the script's flags, so
          the names must be CLI-flag-safe (`help`/`h` are refused).
        required: true
        type: string
      sim_output_dir:
        description: >-
          Where the script writes its per-run output, as a strict checkout-relative
          subpath that EXISTS in the checkout (commit a `.gitkeep`). A fresh host
          directory is mounted over it per case and zipped into the artifact afterwards.
        required: true
        type: string
      oracle_script:
        description: >-
          Optional judge, checkout-relative. Present = GATE mode (run after the sim, same
          image and argv, no GPU; prints one flat JSON dict). Empty = SWEEP mode: the run
          collects evidence and the check is published as neutral, gating nothing.
        required: false
        default: ""
        type: string
      pict_k:
        description: "Covering-array strength, used as requested (no silent downgrade)."
        required: false
        default: 2
        type: number
      repeats:
        description: "Runs per case. 1 is honoured — a pass ratio from one sample is labelled as such."
        required: false
        default: 1
        type: number
      budget:
        description: >-
          Optional wall-clock ceiling in seconds. Checked before each case starts, so the
          cases that ran are a PREFIX of the array and the coverage reported is the
          coverage actually achieved. Empty = no ceiling.
        required: false
        default: ""
        type: string
      sim_image:
        description: >-
          Simulation image, DIGEST-PINNED (`<name>@sha256:<64 hex>`) — a tag is refused.
          Declare the very image your sim script was developed against: Isaac Sim breaks
          its Python APIs across majors and a tag can be repushed under you, so a digest
          is what makes CI the environment you tested locally. Read it off that image
          with: docker inspect --format '{{index .RepoDigests 0}}'
          nvcr.io/nvidia/isaac-sim:5.1.0
        required: true
        type: string
      concurrency:
        description: "Cases in flight at once. Every container shares one GPU; VRAM is the ceiling."
        required: false
        default: 1
        type: number
      report_only:
        description: "Accept a verdict with no boolean key (metrics/notes only) instead of refusing it."
        required: false
        default: false
        type: boolean
      runner_label:
        description: "Label selecting the GPU workstation (a label, never an address)."
        required: false
        default: "cv-infra-gpu"
        type: string

# Least privilege: publish the Check Run and the sticky comment, read the tree.
permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  verify:
    name: cv-infra verify (self-hosted GPU)
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    steps:
      # A self-hosted runner reuses its workspace between jobs; checkout's default
      # `clean: true` is what empties it, so the tree this job reads was delivered by
      # THIS run and a file the PR deleted cannot keep being verified.
      - name: Checkout the caller's repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      # The verification itself. `set +e` around the CLI keeps the publishing steps
      # below alive on a failing run — the verdict is re-exited as the job status at the
      # very end, once the developer-facing output exists.
      #
      # Inputs arrive as env, never interpolated into this script: `${{ }}` inside a run
      # block is textual substitution, and a caller's string would be shell.
      - name: Run cv-infra verify
        id: verify
        env:
          CV_SIM_SCRIPT: ${{ inputs.sim_script }}
          CV_SIM_INPUT_SPACE: ${{ inputs.sim_input_space }}
          CV_SIM_OUTPUT_DIR: ${{ inputs.sim_output_dir }}
          CV_ORACLE_SCRIPT: ${{ inputs.oracle_script }}
          CV_PICT_K: ${{ inputs.pict_k }}
          CV_REPEATS: ${{ inputs.repeats }}
          CV_BUDGET: ${{ inputs.budget }}
          CV_SIM_IMAGE: ${{ inputs.sim_image }}
          CV_CONCURRENCY: ${{ inputs.concurrency }}
          CV_REPORT_ONLY: ${{ inputs.report_only }}
        run: |
          set -uo pipefail
          die() { echo "::error title=cv-infra::$*"; exit 3; }

          # The run dir holds this run's report, payloads, zips and logs. It is REMOVED
          # first: on a self-hosted runner it survives the job, and a stale zip staged as
          # this run's evidence is a lie the artifact cannot be read back out of. Guards
          # are control flow, and the path is derived from RUNNER_TEMP alone.
          tmp="${RUNNER_TEMP:-}"
          [ -n "${tmp}" ] || die "RUNNER_TEMP is unset — refusing to guess a run directory"
          case "${tmp}" in /*) ;; *) die "RUNNER_TEMP is not an absolute path: '${tmp}'" ;; esac
          run_dir="${tmp}/cv-verify"
          rm -rf "${run_dir}"

          args=(
            --sim-script "${CV_SIM_SCRIPT}"
            --input-space "${CV_SIM_INPUT_SPACE}"
            --output-dir "${CV_SIM_OUTPUT_DIR}"
            --pict-k "${CV_PICT_K}"
            --repeats "${CV_REPEATS}"
            --sim-image "${CV_SIM_IMAGE}"
            --concurrency "${CV_CONCURRENCY}"
            --run-dir "${run_dir}"
          )
          if [ -n "${CV_ORACLE_SCRIPT}" ]; then
            args+=(--oracle-script "${CV_ORACLE_SCRIPT}")
          fi
          if [ -n "${CV_BUDGET}" ]; then
            args+=(--budget-s "${CV_BUDGET}")
          fi
          if [ "${CV_REPORT_ONLY}" = "true" ]; then
            args+=(--report-only)
          fi
          # A pull request must never move the baseline it is being judged against: the
          # stored numbers advance only on the events that represent the branch itself.
          if [ "${GITHUB_EVENT_NAME:-}" != "pull_request" ]; then
            args+=(--update-baseline)
          fi

          set +e
          cv-infra verify "${args[@]}"
          code=$?
          set -e
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "run_dir=${run_dir}" >> "$GITHUB_OUTPUT"
          # No report = nothing to publish (a request refused before any container
          # started, or a runner that could not judge). The annotate step still speaks.
          if [ -f "${run_dir}/report.json" ]; then
            echo "have_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_report=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # The shared body, verbatim — $GITHUB_STEP_SUMMARY needs no action.
      - name: Write step summary
        if: always() && steps.verify.outputs.have_report == 'true'
        env:
          CV_RUN_DIR: ${{ steps.verify.outputs.run_dir }}
        run: cat "${CV_RUN_DIR}/payloads/step-summary.md" >> "$GITHUB_STEP_SUMMARY"

      # Exit 2 = the REQUEST was refused. `errors.json` carries the file/line/column the
      # refusal points at, so the developer reads it as an annotation on their own diff
      # instead of digging through a log.
      - name: Annotate the refusal (exit 2)
        if: always() && steps.verify.outputs.code == '2'
        env:
          CV_RUN_DIR: ${{ steps.verify.outputs.run_dir }}
        run: |
          if [ -f "${CV_RUN_DIR}/errors.json" ]; then
            python -m cv_infra.cli.publish_glue annotate "${CV_RUN_DIR}/errors.json"
          fi

      # Check Run + sticky PR comment through the sanctioned API client — no REST call
      # reimplemented here.
      - name: Publish Check Run and sticky comment
        if: always() && steps.verify.outputs.have_report == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        env:
          CV_PAYLOADS: ${{ steps.verify.outputs.run_dir }}/payloads
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const payloads = process.env.CV_PAYLOADS;
            const { owner, repo } = context.repo;
            // (1) Check Run — the conclusion is read, never decided here: the renderer
            // folded it from the report's exit code, the report's single source.
            const check = JSON.parse(fs.readFileSync(path.join(payloads, 'check-run.json'), 'utf8'));
            const head_sha = context.payload.pull_request?.head?.sha || context.sha;
            await github.rest.checks.create({
              owner, repo, head_sha,
              name: check.name, status: check.status,
              conclusion: check.conclusion, output: check.output,
            });
            // (2) Sticky PR comment — upsert in place by the marker (first line of the
            // rendered body) so repeated pushes edit one comment instead of piling up.
            if (context.issue.number) {
              const body = fs.readFileSync(path.join(payloads, 'sticky-comment.md'), 'utf8');
              const marker = body.split('\n', 1)[0];
              const { data: comments } = await github.rest.issues.listComments({
                owner, repo, issue_number: context.issue.number,
              });
              const existing = comments.find((c) => c.body && c.body.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: context.issue.number, body,
                });
              }
            }

      # `upload-artifact`'s `path:` is static YAML, so a TESTED Python step assembles the
      # tree it uploads: report + payloads + the per-case zips and sim logs. It empties
      # the staging directory first (same reason the run dir is removed above).
      - name: Stage the artifacts
        if: always() && steps.verify.outputs.have_report == 'true'
        env:
          CV_RUN_DIR: ${{ steps.verify.outputs.run_dir }}
        run: python -m cv_infra.cli.publish_glue stage-artifacts "${CV_RUN_DIR}" "${RUNNER_TEMP}/cv-verify-artifacts"

      - name: Upload verification artifacts
        if: always() && steps.verify.outputs.have_report == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: cv-infra-verification-results
          path: ${{ runner.temp }}/cv-verify-artifacts
          if-no-files-found: warn

      # The job status is the coarse gate; the nuance (infra = neutral) lives on the
      # Check Run conclusion published above.
      - name: Reflect the verdict
        if: always()
        run: exit ${{ steps.verify.outputs.code }}
