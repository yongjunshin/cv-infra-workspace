# Reusable verification workflow (M8 §3.3, LOCKED §11 / D-H) — the maintained
# adapter a consumer pulls with a single job-level `uses: …@vN` (REQ-INTAKE-003).
#
# AUTHORED + STATICALLY VERIFIED this cycle (p5c3). A live GitHub trigger / real
# Check-and-comment posting is observed in p5c4 — nothing here claims a live run.
#
# Call model (D-H, BLOCKER): a consumer invokes THIS file as a JOB-LEVEL
# `jobs.<id>.uses:` — that calling job carries NO `runs-on`/`steps` (only the
# reusable-workflow keys). This file itself IS the called definition, so its own
# job legitimately has `runs-on`/`steps`. Consumer template (their verify.yml):
#
#   jobs:
#     build-sut:                         # GitHub-hosted, GPU-free
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@<sha>
#         - uses: docker/login-action@<sha>        # GHCR
#         - uses: docker/build-push-action@<sha>   # -> ghcr.io/.../robot@sha256:...
#         - uses: actions/upload-artifact@<sha>    # upload scenarios/ as the inputs artifact
#     verify:                            # job-level uses (no runs-on/steps here — D-H)
#       needs: build-sut
#       permissions: { checks: write, pull-requests: write, contents: read }
#       uses: <org>/cv-infra-workspace/.github/workflows/verify.yml@v1
#       with:
#         sut_image: ghcr.io/.../robot@sha256:...   # image REF only (R10 boundary)
#         scenarios: scenarios/*.yaml
#         runner_label: cv-infra-gpu
#
# SECURITY (R10 / D-J): the caller MUST use the plain `pull_request` trigger, never
# its privileged base-context variant (executing fork-PR head with base secrets on a
# self-hosted GPU box = an RCE pattern — grep-gated to zero occurrences). The SUT
# enters as an image REF only (never source built/run on the GPU); this job does NO
# PR-head `actions/checkout` — the scenario declarations arrive as a download-artifact
# the caller's build job uploaded. Least-privilege `permissions` (checks/PR write,
# contents read).
#
# INPUT HYGIENE (p7c3 T7, v1.2.1): because there is no checkout, nothing emptied
# this job's workspace between runs — `download-artifact` merged onto the previous
# run's tree and `scenarios: <glob>` picked up files the caller had DELETED. The
# job now starts by emptying `$GITHUB_WORKSPACE` and, right before submit, asserts
# that everything the glob selects was delivered by THIS run's artifact. The
# consumer-facing contract (the inputs below, `scenarios` default included) is
# unchanged — a consumer pinning `@v1` gets the repair with no edit.
#
# INPUT VISIBILITY (go2 C6d, AR-33): delivering the inputs into the runner workspace
# is not enough. The CLI validates them on THIS side, but the orchestrator RE-ADMITS
# the request on its own side, and the ride-along artifacts a request may carry —
# `sut.locomotion_policy` and a scenario-adjacent custom oracle module — are read
# from the scenario's directory THERE (D-1: that directory is also what the
# supervisor bind-mounts into the runner). A submission straight from
# `$GITHUB_WORKSPACE` therefore names a path the control plane cannot resolve.
# MEASURED on the go2 consumer PR (2026-09-01, job 99702862827) — the guard below
# listed all 5 delivered files, and 0.3 s later the server rejected the request:
#   sut.locomotion_policy.file: expected an existing, readable file …, got
#   'policy.pt' (resolved: /home/etri/cv-infra-gh-runner-user-go2/_work/…/scenarios/
#   policy.pt)
# The deployment CAN name ONE extra input root (`CV_CI_WORKSPACE_ROOT`, an optional
# `:ro` bind — docs/deploy/README.md §3-②' 함정 4), and on that host it points at a
# DIFFERENT runner's `_work`; a third runner home is simply outside it, and so is
# every consumer host we have not configured. The repair is below and needs neither:
# the guarded tree is COPIED into `${CV_OUT_DIR}/ci-inputs/${GITHUB_RUN_ID}/` — the
# deployment's own job-artifact root, which is always bind-mounted at an identical
# host path — submitted from there, and removed at the end of the job. No contract,
# no mount and no consumer edit: a `@v1` pin gets this the moment the tag moves.
#
# PINS (§2-7): every `uses:` is an immutable commit SHA (trailing comment = the
# semver tag). No floating/mutable tag ref (moving major or branch). Bump = new SHA.
# p5c20 ⑤: the three stock actions moved to their first `runs.using: node24` major
# (download-artifact v7 / github-script v8 / upload-artifact v6) — Node 20 is EOL and
# the runner was force-executing these on Node 24 already. THE INPUTS/SECRETS CONTRACT
# BELOW IS UNCHANGED (consumers call this by `@v1`); only the pins moved. NOTE: those
# majors declare a MINIMUM ACTIONS RUNNER of 2.327.1 — the self-hosted GPU runner pin
# (scripts/workstation_setup/common.sh CV_GH_RUNNER_VERSION=2.335.1) clears it. Keep
# that floor in mind when bumping the runner DOWN or registering a new box.

name: cv-infra-verify

on:
  workflow_call:
    inputs:
      sut_image:
        description: >-
          Pre-built SUT image REFERENCE only (e.g. ghcr.io/owner/robot@sha256:...).
          The robot is never built or run from source on the GPU box (R10 ref-only
          boundary); cv-infra consumes the image ref, not a build context.
        required: true
        type: string
      scenarios:
        description: >-
          Scenario path/glob handed to `cv-infra submit` (D-K: the CLI synthesizes a
          size-N RequestEnvelope from the glob). Default globs the downloaded inputs.
        required: false
        default: "scenarios/*.yaml"
        type: string
      scenarios_artifact:
        description: >-
          Name of the artifact (uploaded by the caller's build-sut job) carrying the
          scenario declarations — downloaded here so the GPU job never checks out
          PR-head source (R10). Contains the scenario YAML(s) referenced by `scenarios`.
        required: false
        default: "cv-infra-verification-inputs"
        type: string
      runner_label:
        description: "self-hosted runner label selecting the GPU workstation (LOCKED §16: label, not IP)."
        required: false
        default: "cv-infra-gpu"
        type: string
      api:
        description: "Orchestrator base URL (empty = the CLI default: same-host 127.0.0.1:8000)."
        required: false
        default: ""
        type: string
      timeout_s:
        description: "Max seconds to await the terminal aggregated verdict; exceeded => exit 3."
        required: false
        default: "3600"
        type: string

# Least privilege (§7.8): post Checks + the sticky PR comment, read the tree. No
# more. `GITHUB_TOKEN` (same repo) suffices — no PAT.
permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  verify:
    name: cv-infra verify (self-hosted GPU)
    # self-hosted GPU selection by LABEL (input, not hardcoded IP — LOCKED §16 / §7.2).
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    steps:
      # ── (0) WORKSPACE PRE-CLEAN (p7c3 T7 — CI 입력 잔존 수리) ──────────────────
      # This job does NO `actions/checkout` (R10) — and checkout was the ONLY step
      # that ever emptied this workspace. On a self-hosted runner the tree therefore
      # SURVIVES between runs and `download-artifact` MERGES onto it, so the glob
      # below picks up residue as if the caller had delivered it.
      # MEASURED 2026-08-29 (consumer PR #4, run 33230008911): the caller delivered
      # 4 scenarios, `scenarios/*.yaml` matched 5, and the 5th was a document the PR
      # had REMOVED the day before (its `request_identity_key` equals the previous
      # run's). It was verified anyway, with no warning. Both directions are wrong:
      # a deleted scenario keeps being verified, and a scenario deleted BECAUSE it
      # was broken keeps producing passes. Until now the "잔존물 0" contract this
      # project holds on the OUTPUT plane had no counterpart on the INPUT plane.
      #
      # WHY IN THE WORKFLOW AND NOT IN THE CLI (G-43): `@vN` moves the YAML plane
      # only; the `cv_infra` package this job executes is pre-installed on the runner
      # and does NOT move with the tag. A repair written in Python would not reach a
      # consumer until the runtime plane is redeployed — this one takes effect the
      # moment the tag moves, which is what makes v1.2.1 "소비자 조치 불요".
      #
      # LAYERING (deliberately not the same cleaner): this empties the WHOLE
      # workspace ONCE, before any input arrives. `publish_glue._prepare_staging_dir`
      # still empties `artifacts/` right before upload (p5c9 — the output-plane twin
      # of this defect, and the composite plane's only cleaner). They do not overlap:
      # after this step that one simply reports `cleared 0 stale entries`.
      #
      # SAFETY: this is a recursive delete on the deployment host (production data
      # lives on the same box). Every guard is CONTROL FLOW, never an echo (G-93);
      # the target comes ONLY from `$GITHUB_WORKSPACE`, never from an input; and
      # `find -delete` unlinks a symlinked entry without following it out. Same guard
      # set as the tested Python twin, minus its `.git` refusal (a sibling workflow
      # may legitimately have checked out into this workspace).
      - name: Clean the workspace before downloading inputs
        id: clean-workspace
        run: |
          set -euo pipefail
          die() { echo "::error::cv-infra workspace pre-clean: $*"; exit 2; }

          ws="${GITHUB_WORKSPACE:-}"
          [ -n "${ws}" ] || die "GITHUB_WORKSPACE is unset/empty — refusing to delete anything"
          case "${ws}" in /*) ;; *) die "GITHUB_WORKSPACE is not an absolute path: '${ws}'" ;; esac
          case "${ws}" in */*/*/*) ;; *) die "GITHUB_WORKSPACE is too shallow to be a runner workspace: '${ws}'" ;; esac
          [ ! -L "${ws}" ] || die "GITHUB_WORKSPACE is a symlink: '${ws}'"
          if [ -n "${HOME:-}" ]; then
            [ "${ws}" != "${HOME}" ] || die "GITHUB_WORKSPACE is \$HOME: '${ws}'"
            case "${HOME}/" in "${ws}"/*) die "GITHUB_WORKSPACE is an ancestor of \$HOME: '${ws}'" ;; esac
          fi
          # Containment: the workspace must live under the runner work root. Measured
          # on the deployment host 2026-08-29 — RUNNER_TEMP is `<runner>/_work/_temp`
          # and the workspace is `<runner>/_work/<repo>/<repo>`. Skipped (not failed)
          # when RUNNER_TEMP is unset: that layout is then unmeasured, not violated.
          if [ -n "${RUNNER_TEMP:-}" ]; then
            work_root="$(dirname "${RUNNER_TEMP}")"
            [ "${ws}" != "${work_root}" ] || die "GITHUB_WORKSPACE IS the runner work root: '${ws}'"
            case "${ws}/" in
              "${work_root}"/*) ;;
              *) die "GITHUB_WORKSPACE '${ws}' is outside the runner work root '${work_root}'" ;;
            esac
          else
            echo "cv-infra: RUNNER_TEMP unset — work-root containment check skipped"
          fi

          # 무엇을 지웠는지가 운영자에게 보여야 한다 (G-26): before / after are logged.
          mkdir -p "${ws}"
          echo "cv-infra: workspace pre-clean target = ${ws}"
          before="$(find "${ws}" -mindepth 1 -maxdepth 1 -printf '%y %f\n' | LC_ALL=C sort)"
          n="$(find "${ws}" -mindepth 1 -maxdepth 1 | wc -l)"
          echo "cv-infra: ${n} top-level entries BEFORE:"
          if [ -n "${before}" ]; then
            printf '%s\n' "${before}" | sed 's/^/  - /'
          else
            echo "  (already empty)"
          fi
          find "${ws}" -mindepth 1 -delete
          left="$(find "${ws}" -mindepth 1 | wc -l)"
          [ "${left}" -eq 0 ] || die "workspace still holds ${left} entries AFTER cleaning — inputs could not be attributed to this run"
          echo "cv-infra: removed ${n} top-level entries; workspace AFTER = 0 entries"

          # Attestation for the input guard below: it is what makes "everything in
          # the workspace was delivered by THIS run" a fact instead of an assumption
          # (a guard that only re-measures the tree it is guarding is empty — G-59).
          stamp="${RUNNER_TEMP:-/tmp}/cv-infra-workspace-clean.stamp"
          printf '%s %s %s\n' "${GITHUB_RUN_ID:-none}" "${GITHUB_RUN_ATTEMPT:-none}" "${ws}" > "${stamp}"
          echo "cv-infra: clean attested for run ${GITHUB_RUN_ID:-none} attempt ${GITHUB_RUN_ATTEMPT:-none} -> ${stamp}"

      # ── (1) Scenario declarations arrive as an artifact (NO PR-head checkout — R10);
      # they land in the workspace the step above just emptied.
      - name: Download scenario inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: ${{ inputs.scenarios_artifact }}

      # ── (2) RESIDUE GUARD — what the glob selects must be what this run delivered
      # The pre-clean above is the repair; this is the tripwire that says so OUT LOUD
      # if it ever stops working (silent recurrence is what cost us PR #4). It runs
      # immediately before `submit` and asserts, in order:
      #   (a) this run's workspace-clean attestation exists and belongs to THIS run
      #       — a removed/reordered/failed pre-clean is caught HERE, at runtime, not
      #       only by the static workflow test;
      #   (b) the `scenarios` pattern selects at least one existing file;
      #   (c) every selected file is one the input artifact put in this workspace.
      # Mismatch = exit 2 (contract-error class) with the delivered list printed, so
      # the operator sees the two sets side by side instead of guessing.
      # NOT strict set equality: the artifact may legitimately carry non-scenario
      # files (a custom-oracle plugin, a README), so the assertion is "selected ⊆
      # delivered", plus "selected ≠ ∅".
      - name: Guard against residual inputs
        id: input-guard
        env:
          CV_SCENARIOS: ${{ inputs.scenarios }}
          CV_SCENARIOS_ARTIFACT: ${{ inputs.scenarios_artifact }}
        run: |
          set -euo pipefail
          die() { echo "::error::cv-infra input guard: $*"; exit 2; }

          ws="${GITHUB_WORKSPACE:-${PWD}}"
          tmp="${RUNNER_TEMP:-/tmp}"
          artifact="${CV_SCENARIOS_ARTIFACT:-the input artifact}"
          [ -n "${CV_SCENARIOS:-}" ] || die "the 'scenarios' input is empty — nothing to submit"

          stamp="${tmp}/cv-infra-workspace-clean.stamp"
          expected="${GITHUB_RUN_ID:-none} ${GITHUB_RUN_ATTEMPT:-none} ${ws}"
          [ -f "${stamp}" ] || die "no workspace-clean attestation — the pre-clean step did not run, so files here cannot be attributed to this run's artifact '${artifact}'"
          got="$(cat "${stamp}")"
          [ "${got}" = "${expected}" ] || die "workspace-clean attestation is from another run/workspace (got '${got}', expected '${expected}')"

          cd "${ws}"
          delivered="${tmp}/cv-infra-delivered-inputs.txt"
          find . -mindepth 1 -type f -printf '%P\n' | LC_ALL=C sort > "${delivered}"
          echo "cv-infra: $(wc -l < "${delivered}") file(s) delivered by artifact '${artifact}':"
          sed 's/^/  - /' "${delivered}"
          echo "cv-infra: scenario pattern = ${CV_SCENARIOS}"

          matched=0
          bad=0
          for f in ${CV_SCENARIOS}; do
            if [ ! -f "${f}" ]; then
              echo "::error::cv-infra input guard: pattern '${CV_SCENARIOS}' matches no file at '${f}'. This job never checks out the consumer repo (R10) — only the files listed above exist here. Check the path/prefix the caller uploads into '${artifact}'."
              bad=1
              continue
            fi
            matched=$((matched + 1))
            rel="${f#./}"
            if grep -Fxq -- "${rel}" "${delivered}"; then
              echo "  + ${rel}"
            else
              echo "::error::cv-infra input guard: '${rel}' is NOT one of this run's delivered inputs — it is residue or lives outside the downloaded artifact '${artifact}'. Verifying it would report on a document this push did not deliver."
              bad=1
            fi
          done
          [ "${matched}" -gt 0 ] || die "the scenario pattern '${CV_SCENARIOS}' selected 0 files — nothing to verify"
          [ "${bad}" -eq 0 ] || die "the submitted scenario set does not match this run's delivered inputs (see the errors above)"
          echo "cv-infra: ${matched} scenario file(s) selected, all delivered by this run."

      # ── (2b) STAGE THE GUARDED INPUTS WHERE THE CONTROL PLANE CAN READ THEM (AR-33)
      # The guard above proved WHAT this run delivered; this step moves that exact
      # tree somewhere the orchestrator can re-admit it from. Copy semantics matter:
      # the whole delivered tree rides, with its relative layout intact, so every
      # ride-along file (`sut.locomotion_policy`, a `module:Class` oracle) still sits
      # NEXT TO its scenario — that adjacency IS the contract (loader stage 5 resolves
      # both against the scenario's directory and refuses anything outside it).
      #
      # THE GUARD'S CONCLUSION MUST SURVIVE THE MOVE, so this step does not merely
      # copy: it asserts the staged tree's relative-path file set EQUALS the delivered
      # list the guard wrote. "Everything submitted was delivered by this run" is then
      # still a fact on the new root, not an assumption about `cp` (G-59). The submit
      # step below `cd`s into this root and keeps the DELIVERED SPELLING of the glob,
      # so `::error file=` annotations still land on the PR diff (D-L).
      #
      # CV_OUT_DIR UNSET = the pre-AR-33 behaviour, unchanged, plus a loud warning:
      # this repair needs a host path BOTH planes can see, and the platform refuses to
      # guess one (FU-10). A carter-shaped consumer (no ride-along file) keeps working
      # either way, which is exactly why the warning has to name what will break.
      #
      # SAFETY: the target is DERIVED here (CV_OUT_DIR + the numeric run id), never
      # interpolated from a workflow expression, and every refusal is control flow
      # (G-93). The only recursive delete is the previous ATTEMPT of THIS run id.
      - name: Stage delivered inputs where the control plane can read them
        id: stage-inputs
        run: |
          set -euo pipefail
          die() { echo "::error::cv-infra input staging: $*"; exit 2; }

          ws="${GITHUB_WORKSPACE:-${PWD}}"
          tmp="${RUNNER_TEMP:-/tmp}"
          out="${CV_OUT_DIR:-}"
          run_id="${GITHUB_RUN_ID:-}"

          if [ -z "${out}" ]; then
            echo "::warning title=cv-infra::CV_OUT_DIR is not set on this runner, so the scenarios are submitted straight from the runner workspace. The control plane re-admits the request against ITS OWN filesystem and does not mount the runner's _work tree: any request carrying a ride-along file next to its scenario (sut.locomotion_policy, a scenario-adjacent custom oracle module) will be REJECTED at admit with 'does not exist' (exit 2). Set CV_OUT_DIR to the deployment's job-artifact root in the runner service environment (<runner home>/.env) — see docs/deploy/README.md."
            echo "dir=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "${out}" in /*) ;; *) die "CV_OUT_DIR is not an absolute path: '${out}'" ;; esac
          [ -d "${out}" ] || die "CV_OUT_DIR '${out}' is not a directory on this runner — it must be the SAME host path the control plane mounts as its job-artifact root"
          [ ! -L "${out}" ] || die "CV_OUT_DIR is a symlink: '${out}' — the control plane resolves the path on its own side, where the link may not exist"
          case "${run_id}" in
            "" ) die "GITHUB_RUN_ID is unset/empty — refusing to stage into a directory this run cannot own" ;;
            *[!0-9]* ) die "GITHUB_RUN_ID is not numeric: '${run_id}'" ;;
          esac

          stage="${out}/ci-inputs/${run_id}"
          # A re-run (attempt 2+) reuses the run id, so an older attempt's tree may be
          # sitting here. Empty it — same reason the workspace is emptied above.
          if [ -e "${stage}" ]; then
            [ ! -L "${stage}" ] || die "'${stage}' is a symlink — refusing to stage into it"
            [ -d "${stage}" ] || die "'${stage}' exists and is not a directory"
            stale="$(find "${stage}" -mindepth 1 | wc -l)"
            find "${stage}" -mindepth 1 -delete
            echo "cv-infra: cleared ${stale} entr(ies) left by an earlier attempt of run ${run_id}"
          fi
          mkdir -p "${stage}"

          # The whole delivered tree, layout intact (`.` = hidden entries included).
          cp -a "${ws}/." "${stage}/"

          # The guard's list, re-measured on the new root: set equality or stop.
          delivered="${tmp}/cv-infra-delivered-inputs.txt"
          [ -f "${delivered}" ] || die "no delivered-input list at '${delivered}' — the input guard did not run, so the staged tree cannot be attributed to this run"
          staged="${tmp}/cv-infra-staged-inputs.txt"
          find "${stage}" -mindepth 1 -type f -printf '%P\n' | LC_ALL=C sort > "${staged}"
          if ! diff -u "${delivered}" "${staged}" > "${tmp}/cv-infra-staging.diff"; then
            sed 's/^/  /' "${tmp}/cv-infra-staging.diff"
            die "the staged tree is not what this run delivered (diff above: '-' = delivered but not staged, '+' = staged but not delivered)"
          fi
          echo "cv-infra: staged $(wc -l < "${staged}") delivered file(s) -> ${stage}"
          sed 's/^/  - /' "${staged}"

          # MEASURED 2026-09-01 on the deployment host: admitting a scenario whose
          # criteria name a scenario-adjacent oracle makes the CONTROL PLANE import
          # that module, which leaves a root-owned `__pycache__/` behind (the plane
          # runs as root in its container). The runner user cannot unlink files inside
          # a root-owned directory, so the cleanup at the end of this job would leave
          # residue forever. Creating the directory FIRST keeps it owned by the runner
          # user: root then writes the .pyc INTO our directory, and we can remove it.
          find "${stage}" -type f -name '*.py' -printf '%h\n' | LC_ALL=C sort -u |
            while IFS= read -r dir; do mkdir -p "${dir}/__pycache__"; done

          echo "dir=${stage}" >> "$GITHUB_OUTPUT"

      # ── (3) Submit + wait: the exit code is the terminal aggregated verdict (0/1/2/3,
      # M8-D11). `set +e` + a captured code keeps publishing on failure; the final
      # step re-exits it so the job reflects the CLI verdict.
      - name: Submit and await verdict
        id: verify
        env:
          # sut_image rides as env (ref-only); scenario->image injection is p5c4.
          CV_INFRA_SUT_IMAGE: ${{ inputs.sut_image }}
          CV_INFRA_API: ${{ inputs.api }}
          # Where the guarded inputs now live (AR-33). Empty = CV_OUT_DIR unset on this
          # runner -> submit from the workspace exactly as before.
          CV_SUBMIT_DIR: ${{ steps.stage-inputs.outputs.dir }}
        run: |
          set +e
          ws="${GITHUB_WORKSPACE:-${PWD}}"
          err="${ws}/submit.err"
          submit_dir="${CV_SUBMIT_DIR:-}"
          [ -n "${submit_dir}" ] || submit_dir="${ws}"
          echo "cv-infra: submitting from ${submit_dir}"
          # D-K: `cv-infra submit <glob> …` synthesizes the size-N envelope (CLI-owned).
          # --trigger-source ci-cd records CI provenance verbatim (REQ-INTAKE-003);
          # --wait folds the terminal aggregated verdict into the exit code.
          # The `cd` is the AR-33 repair and nothing else moves: the glob keeps its
          # delivered spelling, so the request's oracle/policy anchor becomes the
          # staged directory (visible to BOTH planes) while the error `source_path`
          # stays consumer-repo-relative for the PR annotations (D-L).
          out=$(cd "${submit_dir}" && cv-infra submit ${{ inputs.scenarios }} --trigger-source ci-cd --wait \
                  --timeout "${{ inputs.timeout_s }}" 2> "${err}")
          code=$?
          cat "${err}" >&2
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" -eq 2 ]; then
            # Contract error: no report to fetch; the annotate step surfaces the
            # ::error:: lines (machine-readable errors JSON production = p5c4).
            echo "have_report=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          env_id=$(printf '%s\n' "${out}" | head -n1)
          if cv-infra report "${env_id}" --json > report.json 2>> "${err}"; then
            echo "have_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_report=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # report JSON -> the four github.py payloads (glue imports the M4 renderers).
      - name: Render publish payloads
        if: always() && steps.verify.outputs.have_report == 'true'
        run: python -m cv_infra.cli.publish_glue publish report.json payloads

      # Step summary = the shared body verbatim (no action needed — $GITHUB_STEP_SUMMARY).
      - name: Write step summary
        if: always() && steps.verify.outputs.have_report == 'true'
        run: cat payloads/step-summary.md >> "$GITHUB_STEP_SUMMARY"

      # Exit-2 contract errors -> inline YAML annotations on the PR diff (§3.5). The
      # errors JSON is produced in p5c4; this step is best-effort until then.
      - name: Annotate contract errors (exit 2)
        if: always() && steps.verify.outputs.code == '2'
        run: |
          if [ -f errors.json ]; then
            python -m cv_infra.cli.publish_glue annotate errors.json
          fi

      # Post the Check Run + upsert the sticky PR comment via the sanctioned
      # Checks/Comments API client (github-script) — no API reimplemented.
      - name: Publish Check Run and sticky comment
        if: always() && steps.verify.outputs.have_report == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            // (1) Check Run — conclusion comes straight from the payload (github.py
            // folded it from the exit-code single source; exit 3 -> neutral, D-I).
            const check = JSON.parse(fs.readFileSync('payloads/check-run.json', 'utf8'));
            const head_sha = context.payload.pull_request?.head?.sha || context.sha;
            await github.rest.checks.create({
              owner, repo, head_sha,
              name: check.name, status: check.status,
              conclusion: check.conclusion, output: check.output,
            });
            // (2) Sticky PR comment — upsert in place by the marker (first line of
            // the rendered body = STICKY_COMMENT_MARKER) so repeat pushes never pile
            // up new comments (P5-14 in-place).
            if (context.issue.number) {
              const body = fs.readFileSync('payloads/sticky-comment.md', 'utf8');
              const marker = body.split('\n', 1)[0];
              const { data: comments } = await github.rest.issues.listComments({
                owner, repo, issue_number: context.issue.number,
              });
              const existing = comments.find((c) => c.body && c.body.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: context.issue.number, body,
                });
              }
            }

      # Stage the manifest's curated artifact bytes (결정 #1/2/3): the glue already
      # applied selection/size-cap into payloads/artifact-manifest.json — its
      # uploads[] carry the per-run host paths (MCAP/mp4/result.json). upload-artifact's
      # path: is static YAML and cannot read that dynamic list, so a TESTED Python step
      # copies only the curated uploads into artifacts/ (missing/excluded NOT staged).
      - name: Stage curated artifacts
        if: always() && steps.verify.outputs.have_report == 'true'
        run: python -m cv_infra.cli.publish_glue stage-artifacts report.json artifacts

      # Artifacts (결정 #1/2/3): report.json + payloads/ (Check/comment/manifest) +
      # the staged artifacts/ tree (result.json + selected rosbag/video the developer
      # downloads from the PR). if-no-files-found=warn: an empty stage never fails.
      - name: Upload verification artifacts
        if: always() && steps.verify.outputs.have_report == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: cv-infra-verification-results
          path: |
            report.json
            payloads/
            artifacts/
          if-no-files-found: warn

      # ── (8) ALWAYS give the staged inputs back (AR-33). They live under the
      # deployment's artifact root, which is production storage on a shared host —
      # "잔존물 0" is the same rule the output plane already holds itself to.
      # This step deletes ONE directory: the `ci-inputs/<this run id>` tree the
      # staging step created. The path is DERIVED here from the same two variables
      # (never taken from a step output, never from a workflow expression), every
      # refusal is control flow, and other runs' trees plus every `cvj-*` job
      # directory are outside it by construction.
      # NOT FATAL: a leftover is reported as a warning, not as a red job — turning a
      # passing verification red because the control plane left a root-owned file
      # behind would punish the consumer for our own housekeeping.
      - name: Remove this run's staged inputs
        id: cleanup-inputs
        if: always()
        run: |
          set -uo pipefail
          out="${CV_OUT_DIR:-}"
          run_id="${GITHUB_RUN_ID:-}"
          if [ -z "${out}" ]; then
            echo "cv-infra: CV_OUT_DIR unset — nothing was staged, nothing to remove"
            exit 0
          fi
          case "${out}" in /*) ;; *) echo "::warning title=cv-infra::staged-input cleanup skipped: CV_OUT_DIR is not an absolute path ('${out}')"; exit 0 ;; esac
          case "${run_id}" in
            ""|*[!0-9]*)
              echo "::warning title=cv-infra::staged-input cleanup skipped: GITHUB_RUN_ID is unset or not numeric ('${run_id}') — refusing to delete a directory this run cannot name"
              exit 0 ;;
          esac
          stage="${out}/ci-inputs/${run_id}"
          if [ ! -d "${stage}" ] || [ -L "${stage}" ]; then
            echo "cv-infra: no staged-input directory at ${stage} — nothing to remove"
            exit 0
          fi
          n="$(find "${stage}" -mindepth 1 | wc -l)"
          find "${stage}" -mindepth 1 -delete 2>/dev/null
          rmdir "${stage}" 2>/dev/null
          if [ -e "${stage}" ]; then
            echo "::warning title=cv-infra::staged inputs could not be fully removed from ${stage} (entries left, listed below). The control plane runs as root and may leave a bytecode cache next to a custom oracle; remove it on the deployment host."
            find "${stage}" -mindepth 1 -printf '  - %y %M %u %P\n'
            exit 0
          fi
          echo "cv-infra: removed ${n} staged entr(ies); ${stage} is gone"

      # Reflect the CLI verdict as the job status (the nuanced infra=neutral signal
      # lives on the Check Run conclusion above; the job status is the coarse gate).
      - name: Reflect verdict
        if: always()
        run: exit ${{ steps.verify.outputs.code }}
