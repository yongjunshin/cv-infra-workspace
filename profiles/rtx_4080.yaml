# profiles/rtx_4080.yaml — adaptive GPU profile (M5 §3.4; REQ-DEPLOY-003, NFR-DEPLOY-001).
#
# Read profiles/rtx_pro_6000.yaml first — it carries the grammar rules and the reason
# this directory exists. Adding THIS file is the whole act of supporting a new card:
# no code, no compose, no CI was touched to make this host deployable.
#
# WHY IT EXISTS: this is the project's SECOND deployment host (cycle p5c17, decision
# 2026-08-19-p5c17-os-set-pin-set-and-host-purity; target fixed by decision D-6,
# 2026-08-18). Until now every measurement in this repository came from one machine
# with one card, so "적응형" had never been exercised by an actual second card.
#
# ★ MEASURED — this profile carries a real per-instance VRAM number (see
# vram_per_instance_mb / vram_per_instance_source below).
#
# HISTORY, because this header used to say the opposite: the profile was AUTHORED
# empty (p5c17 T1 was CPU-only by mandate, so no job had run on the card yet) under
# the same rule as profiles/a100.yaml — an invented number would have been strictly
# worse than an empty one, this card having ~16 GiB against the 6000-series' ~96 GiB,
# so a copied budget would have mis-sized k by ~6x. The number was then MEASURED
# later in the same cycle (p5c17 T4) on a live job and written in with its evidence
# path (G-24). This header was not updated at that moment and stood contradicting
# its own file until p5c18 (found by the M3 budget-wiring task, fixed by PM).
# The lesson is G-79's: the value and the prose about the value must move together.
#
# Consequence at deploy time, now that the number is here: scripts/detect_gpu.sh
# emits the CV_VRAM_PER_INSTANCE_MB line UNCOMMENTED, so the NVML 2nd guard is ON
# and k = min(CV_MAX_CONCURRENT, floor(availVRAM / per_instance), render_cap).
# (For a profile that is still empty — a100.yaml — the line is emitted COMMENTED
# OUT, the guard stays OFF, and the script says so loudly rather than guessing.)
#
# To re-measure (another host, another variant, a driver/Isaac change): run one job
# and sample per-PID VRAM
#   nvidia-smi --query-compute-apps=pid,used_memory --format=csv
# cross-checked against the full (G+C) process table minus idle baseline
# (DoD-P2-09 / DoD-P4-10 recipe), then replace BOTH the number and its
# vram_per_instance_source line — never one without the other.
#
# ★ THE SOURCE LINE NAMES THE EXACT CARD, and it must keep doing so: the
# pattern below matches a FAMILY (see note), and this family is known to ship in
# variants (SUPER / Laptop / OEM spellings) whose name strings and VRAM this project
# has never observed. A number measured on one variant must not be read as measured
# on another — an operator on a different 4080 variant re-measures.
#
# Card facts observed on the deployment host (read-only query, 2026-08-19, T1):
#   nvidia-smi --query-gpu=name,memory.total,driver_version,compute_cap --format=csv,noheader
#   -> NVIDIA GeForce RTX 4080, 16376 MiB, 580.178.04, 8.9
# Unlike profiles/a100.yaml this IS a consumer card with a display engine, so the
# off-screen render path (D-A) has no datacenter-specific caveat here — but it has
# also never been exercised on it. Observe on first deployment; do not assume.

id: rtx_4080

# Matched case-insensitively (ERE) against `nvidia-smi --query-gpu=name`, whose live
# output on this host is the literal string "NVIDIA GeForce RTX 4080" (captured above
# — unlike the other two profiles, this pattern is anchored in a REAL capture).
# Token-based like its siblings so board-partner/spelling variants of the same family
# still resolve; "GeForce" is kept in the token deliberately, so the pattern cannot
# reach across into the professional line. Checked against the other profiles: this
# pattern matches neither of their SKUs, and neither of theirs matches this card
# (detect_gpu.sh exits 3 on a 2+ match, so overlap would break BOTH hosts).
match_name_pattern: GeForce[ _-]?RTX[ _-]?4080

# MEASURED 2026-08-19 (p5c17 T4) on the card described above, during one live
# `cv-infra selftest` job on this host. Recipe = DoD-P2-09 / DoD-P4-10: 0.5 s polling of
# `nvidia-smi --query-compute-apps=pid,used_memory` cross-checked against GPU-wide
# `memory.used` minus the idle baseline. 181 samples over a 96.9 s job gave
#   per-PID compute PEAK   3743 MiB   (median 678, p95 2569 — the peak is TRANSIENT,
#                                      it lands in scene load / first render, not the mission)
#   GPU-wide peak 4248 MiB - idle median 463 MiB = 3785 MiB   <- the value below
# The two agree within 42 MiB. The gap is the display-engine/graphics context that
# --query-compute-apps does NOT report on a consumer card, so the cross-check is the
# LARGER of the two and therefore the safe one to budget with. Nothing is rounded.
# ★ This host runs a DESKTOP: Xorg + shell + browser held ~460 MiB of the 16376 MiB at
# idle. A headless 4080 has that much more available; the per-instance number is
# unaffected, the free-VRAM term is not.
# What it implies for k HERE: avail ~15.9 GiB / 3785 MiB -> the NVML 2nd guard admits 4,
# so k = min(CV_MAX_CONCURRENT, 4, render_cap). The deployment that measured it ran with
# CV_MAX_CONCURRENT=2 and k stayed 2 (observed in serve-config). Raising the operator cap
# is an operator decision, not a consequence of this number.
vram_per_instance_mb: 3785
vram_per_instance_source: measured 2026-08-19 (p5c17 T4) on NVIDIA GeForce RTX 4080 16376 MiB sm 8.9 driver 580.178.04, ubuntu/jammy desktop host (display active, ~460 MiB idle baseline) — GPU-wide peak 4248 MiB minus idle median 463 MiB, per-PID compute peak 3743 MiB, 181 samples at 0.5 s over one live selftest job; NOT transferable to a SUPER/Laptop/OEM 4080 (re-measure there); evidence agent-comms/reports/deployment-2026-08-19-p5c17-T4-c2-walkthrough.md and raw samples on that host at ~/cv-infra-p5c17-t4-evidence/12-vram-samples-dense.txt (2 s run-1 cross-check 09-vram-samples.txt, per-PID peak 3712 MiB)
