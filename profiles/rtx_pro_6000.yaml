# profiles/rtx_pro_6000.yaml — adaptive GPU profile (M5 §3.4; REQ-DEPLOY-003, NFR-DEPLOY-001).
#
# WHY THIS FILE EXISTS: `profiles/**` is the ONLY sanctioned home for GPU model
# knowledge (M5 D9 / implementation-plan/_meta/revision-decisions.md:103 — scan
# target = cv_infra/**·docker/**·scripts/**·CI, allowlist = profiles/**). Supporting
# a new GPU means ADDING A FILE HERE, never editing code or compose. That is the
# whole content of "적응형 설치 / no single-machine hardcoding".
#
# GRAMMAR (load-bearing, keep it): flat `key: value`, one per line, no nesting, no
# inline comments after a value, no `: ` inside a value. TWO parsers read this file —
# scripts/detect_gpu.sh (sed/awk, because a freshly provisioned host may have no
# python) and the tests (pyyaml). tests/test_deploy_gpu_profiles.py asserts the two
# agree on every field; nesting would silently break the shell side only.
#
# NUMBERS ARE MEASURED, NEVER GUESSED (CLAUDE §2-4). Every quantitative field has a
# `*_source` sibling naming the evidence that reproduces it (G-24). No measurement
# -> leave the value EMPTY (see profiles/a100.yaml); an invented number here would
# silently mis-size the concurrency guard on someone else's host.

id: rtx_pro_6000

# Matched case-insensitively (ERE) against `nvidia-smi --query-gpu=name`.
# Deliberately TOKEN-based, not a full product string: this repository has never
# captured an nvidia-smi name line for this SKU. What is recorded is the
# identification "RTX PRO 6000 Blackwell" (agent-comms/decisions/
# 2026-07-07-workstation-access-ssh-first-alpacon-fallback.md:26 —
# "hostname etri6000 · IP 10.254.170.62 · RTX PRO 6000 Blackwell";
# implementation-plan/nfr-measurement-notes.md, every measurement block's 조건 line).
# A token pattern therefore matches every spelling of the SKU family (Workstation
# Edition / Server Edition / Max-Q) without pretending to know which one is present.
match_name_pattern: RTX[ _-]?PRO[ _-]?6000

# Per-instance VRAM in MiB -> emitted as CV_VRAM_PER_INSTANCE_MB, i.e. the NVML 2nd
# guard input of k = min(max_concurrent, floor(availVRAM / this), render_cap)
# (cv_infra/orchestrator/scheduler.py::compute_k, LOCKED §7.4).
# ★ TWO LIMITS, STATED (do not silently inherit them):
#   * the workload WAS valid (carter scenarios x4, repeats 2, k=1..8 — a MOVING robot, so
#     G-85/G-80 do not bite here the way they bit rtx_4080.yaml), but the number is the
#     ROUNDED top of a mean band (5947-6043 MiB), not the verbatim observed maximum that
#     the 4080 profile's adoption rule requires. On this card it changes nothing
#     operationally: floor(97192/6000) = floor(97192/6043) = 16, and this deployment runs
#     CV_MAX_CONCURRENT=2. Re-measure with the 0.5 s per-PID method when a moving SUT is
#     next available on this host and replace BOTH the number and its source line.
#   * only method (B) (per-PID) was ever run here. Method (A) (GPU-wide peak minus idle),
#     which is what catches the graphics context, has never been run on this card.
#
# ★ BATCH-FORM MEASUREMENT (2026-08-27, W3 = p6c4 T2) — BOTH limits above are now retired,
# and the ADOPTED VALUE BELOW IS DELIBERATELY LEFT AT 6000 (p6c5 T4 scope: annex only).
# What was run: ONE p6 batch carrier (설계 §0-7) on this card — 60 samples of one random
# request through M3 `run_batch`, 3819 s wall, per-PID sampling every 0.5 s (6867 app ticks
# / 6955 GPU ticks), a MOVING nova_carter_warehouse mission per sample (not `selftest` —
# G-80). Applying `profiles/rtx_4080.yaml`'s adoption rule (the LARGER of the two methods,
# no rounding, no margin):
#   (A) GPU-wide peak 6006 MiB - idle baseline (median 35 over the 30 ticks before the
#       carrier; min 35 / max 53)                                      = 5971 MiB   <- larger
#   (B) per-PID `--query-compute-apps` peak                            = 5927 MiB
#   steady-state only (excluding the i=0 boot peak): A 5883 / B 5840.
# So the rule's value on THIS evidence is 5971 MiB, and method (A) has now run here (and
# WON, by +44 MiB — the graphics context per-PID omits is real on this card too).
# WHY THE FILE STILL SAYS 6000: this file's own rule is "replace BOTH the number and its
# source line, never one without the other", and that swap is a value change, not an annex —
# it is left to the PM/CEO (p6c5 T4 changed no adopted value anywhere). Operationally the
# difference is nil and errs SAFE: 6000 > 5971 budgets slightly MORE per instance, and
# floor(97192 / 5971) = floor(97192 / 6000) = 16 while this deployment runs
# CV_MAX_CONCURRENT=2, so k does not move either way.
# LIMITS OF THE 5971 FIGURE (state them, do not silently inherit them): measured at k=1
# (no concurrent carrier); ONE scenario family, so it is an observed maximum, not a proven
# bound; per CARRIER, and the observation that it does not grow with n rests on a single
# +64 MiB step at sample 19 (W3 §3.1) — a longer batch could show another step.
# Evidence: `~/cv-infra-p6c1-evidence/p6c4/w3/vram_0.5s.csv` + `w3/crosscheck/` (114 full
# process-table + `pmon` captures) + `w3/ANALYSIS.txt`; report
# `agent-comms/reports/runner-2026-08-27-p6c4-t2-gpu-w3.md` §3 게이트 5 / §5.2.
# 결정(2026-08-27, p6c5 PM/게이트#3): 채택값 6000 유지 — 규칙(larger-of)이 현재 증적에 주는 값은
# 단일형 5994~6010(p6c1)·배치형 5971(W3 n=60)로 갈라져 있고, 값+_source 동시 교체는 배포 팀의
# 정식 재측정 태스크로 이연한다(그때까지 이 갈림은 침묵이 아니라 여기 명시로 존재한다). k 불변.
vram_per_instance_mb: 6000
vram_per_instance_source: implementation-plan/nfr-measurement-notes.md P4c5 (2026-07-15, QA passed) per-PID steady peak ~6.0 GiB, mean 5947-6043 MiB, flat over k=1..8; raw evidence WAS on the workstation at ~/cv-infra-p2-out/p4c5/{T6,T6-resume}/ — INTENTIONALLY EXPIRED 2026-08-20 (decision p5c19 D-1), file list + sha256 preserved in the meta repo evidence manifest; re-measure rather than cite the dead path; the same 6000 ran live as the NVML guard in the p5c10 k=8 leg
