[project]
name = "cv-infra"
description = "Continuous verification infrastructure: Isaac Sim simulation gating for robot SW in CI/CD."
readme = "README.md"
requires-python = "==3.11.*"
dynamic = ["version"]
# ONE runtime dependency, exact-pinned (CLAUDE.md §2-3). Everything else the verify
# pipeline needs is the standard library: the contract is text and JSON, the report is a
# dict, and the only thing that cannot be stdlib is talking to the docker daemon.
# It is imported LAZILY (cv_infra/execution.py::resolve_docker_client), so the CLI's
# --help and every rejection path work on a host without a docker daemon.
dependencies = [
    "docker==7.1.0",
]

# Console script (verbatim pin, do not change): `cv-infra verify ...`.
[project.scripts]
cv-infra = "cv_infra.cli.main:main"

# Dev toolchain — exact-pinned for local/CI parity (CLAUDE.md §2-3, since 2026-06-24).
# uv installs this group by default on `uv sync`.
[dependency-groups]
dev = [
    "ruff==0.15.19",
    "black==26.5.1",
    "pytest==9.1.1",
    "import-linter==2.12",
    # Branch-coverage instrumentation. `[toml]` extra = coverage reads its config out of
    # pyproject.toml below. pytest-cov is deliberately NOT added: `coverage run -m pytest`
    # covers the whole need, and one fewer plugin is one fewer coupling to pytest.
    "coverage[toml]==7.16.0",
]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

# Single source of truth for the version = cv_infra/__init__.py (__version__).
[tool.hatch.version]
path = "cv_infra/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["cv_infra"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The extended half (B/SIM/RET/PIE/PERF/C901) is a ratchet: it was adopted only after
# every violation it flags was fixed, so `ruff check .` stays a single green/red signal
# and a regression cannot hide behind a growing baseline. Adding a family here is a
# deliberate call; silencing one carries its reason in writing (below).
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RET", "PIE", "PERF", "C901"]

[tool.ruff.lint.mccabe]
# ruff's C901, which is NOT radon's cc — the number is calibrated on ruff's scale. 14
# keeps the worst shapes out while leaving the blocks we deliberately kept alone
# (loudest surviving block today: scripts/isaac_smoke/headless_smoke.py::run_handshake,
# ruff 11). ruff's own default (10) would flag those, turning the gate into noise.
max-complexity = 14

[tool.ruff.lint.per-file-ignores]
# The tests' assertions are the net; the opinion rules would rewrite what they assert.
# B017 (`pytest.raises(Exception)`) narrowed changes the proposition; SIM300 flips a
# comparison's expected/actual sides. E/F/I/W/UP still apply to tests — syntax, unused
# names and import order are not assertions.
"tests/**" = ["B", "SIM", "RET", "PIE", "PERF", "C901"]

[tool.black]
line-length = 100
target-version = ["py311"]

# --------------------------------------------------------------------------- #
# Branch coverage. Invoke it exactly the way CI does (.github/workflows/ci.yml):
#   env -u PYTHONPATH uv run coverage run -m pytest -q
#   env -u PYTHONPATH uv run coverage report
# (`env -u PYTHONPATH` because a sourced ROS 2 environment leaks its PYTHONPATH into the
# shell and breaks pytest collection — measured on the development host.)
# The flags live HERE and nowhere else, so a local run and the CI run cannot diverge:
# CI passes no coverage options at all.
[tool.coverage.run]
branch = true          # branch, not line — an unvisited branch must not hide behind a total.
source = ["cv_infra"]  # product code only; tests/ and scripts/ are not instrumented.

[tool.coverage.report]
show_missing = true
precision = 1

# 100, restored (it was temporarily 95 through an earlier rewrite). The suite measures
# 100.0% of statements AND branches on every module, so this is the number the code
# actually holds — not an aspiration. A ratchet below the measured value is worse than
# no ratchet: it silently permits the first uncovered branch, which is exactly the one
# nobody meant to add. A module that cannot reach 100 carries per-line
# `# pragma: no cover - <reason>` (process entry lines), never a lowered total.
fail_under = 100
#
# exclude policy = coverage's default pragma regex only. The convention
# `# pragma: no cover - <reason>` already matches it, so no extra config is needed.
# No `exclude_also` broad patterns: a broad exclusion silently erases gaps and only
# raises the total. Exclusions are per line, with their reason.
