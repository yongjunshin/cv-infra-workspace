[project]
name = "cv-infra"
description = "Continuous verification infrastructure: Isaac Sim simulation gating for robot SW in CI/CD."
readme = "README.md"
requires-python = "==3.11.*"
dynamic = ["version"]
# Runtime deps — exact-pinned (CLAUDE.md §2-7). Host-side control plane only;
# both are lazy-imported (runner image installs the wheel --no-deps and never
# imports them — DoD-P2-12).
dependencies = [
    "docker==7.1.0",  # M3 supervisor spawn/teardown
    "pyyaml==6.0.2",  # M8 CLI scenario loading (`cv-infra run`; --help stays dependency-free)
    # M1 Phase-3 contract models (schema/loader/version — lazy-exported so
    # `import cv_infra.contract` stays stdlib-only). Consumed on BOTH planes
    # (D-4', decisions/2026-07-10-p3-consume-decisions.md): host/CLI via this
    # pin, runner via the kit-prebundled pydantic — the wheel still installs
    # --no-deps; docker/runner/Dockerfile's BUNDLE_SUPPLIED guard asserts the
    # bundled version equals this pin at build time.
    # BUNDLE-ALIGNED PIN (PM ruling, decisions/2026-07-10-p3-entry-decisions.md
    # D-1 ruling): the image #5 kit-prebundled interpreter already ships
    # pydantic 2.11.7 / pydantic_core 2.33.2 (T1 probe measurement,
    # ~/cv-infra-p2-out/p3c1/probe/bundled-pydantic.txt) — the host pin matches
    # it so contract validation semantics/error prose never skew across planes.
    "pydantic==2.11.7",
    # M3 scheduler NVML 2nd guard (REQ-ORCH-005, LOCKED §7.4) — lazy-imported
    # inside PynvmlVramGauge so GPU-free hosts import cleanly. Control plane
    # runs in the host venv only (no kit-bundle alignment concern, G-27);
    # pinned to the current PyPI stable (2026-06-01 release).
    "nvidia-ml-py==13.610.43",
    # M3 REST submit surface (api.py — REQ-INTAKE-001, M3 §2.1 Reuse). Host
    # venv only (no kit-bundle alignment concern, G-27); fastapi 0.139.0
    # declares pydantic>=2.9.0 — compatible with the bundle-aligned 2.11.7 pin
    # above (uv lock re-checks the constraint). uvicorn is the P5 compose
    # server; nothing in cv_infra imports it yet (resident deployment = P5).
    "fastapi==0.139.0",
    "uvicorn==0.51.0",
    # M8 batch-CLI REST client (cv_infra/cli/batch.py: submit/status/wait —
    # REQ-INTAKE-001/003). Promoted dev -> runtime at p4c3 (pin unchanged);
    # lazily imported via the batch module so --help stays dependency-free.
    "httpx==0.28.1",
]

# Console script (cross-team contract — verbatim pin, do not change).
# M8 implements `def main() -> int` (exit-code) at cv_infra/cli/main.py.
[project.scripts]
cv-infra = "cv_infra.cli.main:main"

# Oracle plugin registry (M1 §3.6, REQ-INTAKE-007): the contract loader binds
# acceptance-criteria oracles through this entry-point group (stdlib
# importlib.metadata discovery — custom oracles register here from their own
# distribution, or are addressed by an explicit "module:Class" path).
[project.entry-points."cv_infra.oracles"]
reached_goal = "cv_infra.oracles.reached_goal:ReachedGoalOracle"
no_collision = "cv_infra.oracles.no_collision:NoCollisionOracle"

# Dev toolchain — exact-pinned for local/CI parity (decision 2026-06-24 env-reproducibility §4).
# uv installs this group by default on `uv sync`.
[dependency-groups]
dev = [
    "ruff==0.15.19",
    "black==26.5.1",
    "pytest==9.1.1",
    "import-linter==2.12",
    # httpx moved to [project.dependencies] at p4c3 (CLI REST client).
]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

# Single source of truth for the version = cv_infra/__init__.py (__version__).
[tool.hatch.version]
path = "cv_infra/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["cv_infra"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# p8c1 (CEO 결정 2026-08-30 ④) — 확장 룰 상시 채택 = 래칫. The extended half
# (B/SIM/RET/PIE/PERF/C901) was adopted only AFTER every violation it flags was
# fixed in production code, so `ruff check .` stays the single green/red signal
# (CI: .github/workflows/ci.yml tier-1) and a regression cannot slip in behind a
# growing baseline. Adding a rule family here is a cycle-level decision; silencing
# one is too (per-file-ignores below carries its reason in writing).
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RET", "PIE", "PERF", "C901"]

[tool.ruff.lint.mccabe]
# 래칫: p8c1 took the codebase to radon E/D = 0 and this ceiling keeps the worst
# shapes out, while leaving the surviving C blocks alone — C is tolerated (개선이
# 명확할 때만 수리, karpathy: 지표 허영 churn 금지), D/E is not. ruff's own default
# (10) would flag C blocks we deliberately kept, turning the gate into noise.
#
# ⚠ 실측 주의 (2026-08-30, T5) — ruff's C901 and radon's cc are DIFFERENT metrics
# and this number is ruff's. Measured on the pre-p8c1 tree, the four monsters p8c1
# removed scored: runner/batch.run radon E(32) = ruff 15 · supervisor.run_batch
# D(30) = ruff 20 · supervisor.run_job D(21) = ruff 15 · runner/main.run D(21) =
# ruff 15. So `> 15` re-admits three of the four EXACTLY at the boundary; only
# `<= 14` blocks all of them (today's loudest surviving block is ruff 11 —
# scripts/isaac_smoke/headless_smoke.py::run_handshake — so 14 is adoptable with a
# margin of 3). 15 is the value CEO 결정 2026-08-30 ④ names; tightening it to 14 is
# a decision, not a team edit (p8c1 T5 report에 근거·권고 기재).
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# §3-9 그물 보존 — 테스트 단언 바이트 동결(B017 등은 단언 의미를 바꾼다).
# 실측 2026-08-30(채택 config 기준, T5): tests 발화 23건, 전부 의도적 미적용.
# (ruff 기본 mccabe=10 기준으로는 25건 — 차이는 tests/negative/test_batch_no_residue.py
# 의 C901 2건.) 발화 내역: SIM300 12 · PERF401 3 · B018 2 · SIM117 2 ·
# B017 1 · B905 1 · RET501 1 · SIM102 1. 예: B017 `pytest.raises(Exception)` 은
# 좁히는 순간 다른 명제를 단정하게 되고, SIM300 은 단언의 좌우(기대값 vs 실측값)를
# 뒤집는다 — 리팩토링 금지 사이클에서 그물을 건드리지 않기 위한 의도적 침묵이다.
# E/F/I/W/UP 는 tests 에도 그대로 적용된다(문법·미사용·정렬은 그물이 아니다).
"tests/**" = ["B", "SIM", "RET", "PIE", "PERF", "C901"]

[tool.black]
line-length = 100
target-version = ["py311"]
